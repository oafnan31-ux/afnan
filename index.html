<style>

dden;text-align:center;padding:20px}.video-box:before,.video-box:after{content:'✦';position:absolute;color:#fff2;font-size:110px}.video-box:before{left:6%;top:0}.video-box:after{right:8%;bottom:-25px}.play{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-size:25px;margin:0 auto 9px;box-shadow:0 4px 14px #0003}.videocontent{position:relative;z-index:1}.questionbox{padding:17px 19px;border-radius:16px;background:var(--sand2);margin:18px 0}.gamearea{background:#f8f8f5;border:1px solid var(--line);padding:20px;border-radius:18px;margin:18px 0}.choicegrid{display:flex;flex-wrap:wrap;gap:10px;margin:13px 0}.choice{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 17px;color:var(--navy);font-weight:700;min-width:58px}.choice:hover{border-color:var(--blue)}.choice.selected{background:var(--navy);border-color:var(--navy);color:white}.choice.correct{background:#e4f0e7;border-color:#76a183;color:#28543a}.choice.wrong{background:#f8e5e2;border-color:#d69a91;color:#8b3c35}.feedback{min-height:30px;font-weight:700;margin:8px 0}.feedback.ok{color:var(--green)}.feedback.no{color:#a65650}.inputrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}.textinput{border:1px solid #d8d5ce;border-radius:11px;padding:10px 12px;min-width:110px;background:#fff;color:var(--ink)}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.sidepanel h3{margin:0 0 6px;color:var(--navy)}.sidepanel p{font-size:14px;color:var(--muted)}.linkfield{display:flex;gap:6px}.linkfield input{min-width:0;flex:1}.sidepanel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px}.sidepanel .btn{margin-top:8px;width:100%}.statusrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.treasure{background:linear-gradient(145deg,#284b57,#17354b);color:white;border-radius:24px;padding:28px;margin:30px 0;display <body><header class="topbar"><div class="shell nav"><a class="brand" href="#home" aria-label="الصفحة الرئيسية"><span class="brandmark">✧</span><span>مغامرة القواسم</span></a><div class="navright"><span class="pill">الصف السادس الابتدائي</span><span class="pill" id="navPoints">⭐ ٠ نقطة</span><button class="iconbtn" onclick="resetAsk()" title="إعادة اللعب" aria-label="إعادة اللعب">↻</button></div></div></header><main class="shell" id="app"></main><div class="toast" id="toast" role="status"></div><div class="overlay" id="overlay"><div class="modal"><div style="font-size:65px">🗝️</div><h2 id="modalTitle">رائع!</h2><p id="modalText">أتممت المغامرة!</p><button class="btn primary" onclick="closeModal()">متابعة الرحلة ✨</button></div></div>
<script>
const stages=[['شاهدي واكتشفي','ابدئي بسؤال يفتح باب التفكير.','تمهيد'],['اكتشفي القاعدة','اختاري القواسم المشتركة واكتشفي السر.','اكتشاف'],['تحدي المجموعات','ثلاث مهمات رياضية من محتوى الدرس.','تحدي'],['مسابقة تفاعلية','أجيبي عن أسئلة الكتاب واكسبي النقاط.','مسابقة'],['افتحي صندوق الكنز','حلّي مسألة الفطائر لفتح الكنز.','الكنز'],['بطاقة الخروج','تحققي من فهمك قبل نهاية الدرس.','ختام']];
const initial={points:0,done:[],badges:[],video:'',links:{}};const savedSettings=JSON.parse(localStorage.getItem('qawasim-save')||'{}');let state={...initial,video:savedSettings.video||'',links:savedSettings.links||{}};let view='home';let selectedFactors=[];let groupIndex=0;let groupExplainAwarded=false;let quizIndex=0;let exitIndex=0;let cakeDone=false;
function save(){localStorage.setItem('qawasim-save',JSON.stringify({video:state.video,links:state.links}));document.getElementById('navPoints').textContent='⭐ '+state.points+' نقطة'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function markDone(n){if(!state.done.includes(n)){state.done.push(n);state.points+=10;save();if(state.done.length===6)win()}}
function win(){document.getElementById('modalTitle').textContent='أحسنتِ يا بطلة القواسم!';document.getElementById('modalText').textContent='أكملتِ المراحل الست وجمعتِ '+state.points+' نقطة. صندوق الكنز أصبح لكِ!';document.getElementById('overlay').classList.add('show')}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function resetAsk(){document.getElementById('modalTitle').textContent='إعادة المغامرة؟';document.getElementById('modalText').innerHTML='سيُعاد ضبط النقاط والتقدم والشارات. <button class="btn primary" onclick="resetGame()">نعم، أعيدي اللعب</button>';document.getElementById('overlay').classList.add('show')}
function resetGame(){state={points:0,done:[],badges:[],video:state.video,links:state.links};save();view='home';closeModal();render();toast('بدأت مغامرة جديدة!')}
function navCard(i){view='stage'+i;selectedFactors=[];render();window.scrollTo({top:0,behavior:'smooth'})}
function badgeList(){return state.badges.length?state.badges.map(x=>`<span class="badge">🏅 ${x}</span>`).join(''):'<span class="muted">ابدئي اللعب لتحصلي على الشارات!</span>'}
function map(){return `<div class="mapline" aria-label="خريطة المراحل">${stages.map((s,i)=>`<button class="mapstep ${view==='stage'+(i+1)?'active':''} ${state.done.includes(i+1)?'done':''}" onclick="navCard(${i+1})"><span class="bubble">${state.done.includes(i+1)?'✓':i+1}</span><small>${s[2]}</small></button>`).join('')}</div>`}
function home(){let pct=Math.round(state.done.length/6*100);return `<section class="lesson-frame home-frame"><header class="frame-top"><div><b>الصف السادس الابتدائي · رياضيات</b><small>تاريخ الدرس: ١٤٤٨/٥/٢٥</small><small>إعداد المعلمة: هند كعبي</small></div><div class="frame-actions"><span class="score-chip">⭐ ${state.points} نقطة</span><button class="btn outline small" onclick="resetAsk()">إعادة اللعب</button></div></header><div class="progresswrap"><div class="progressbar" style="width:${pct}%"></div></div><section class="home-intro"><div class="eyebrow">${state.done.length?`أكملتِ ${state.done.length} من ٦ مراحل`:'مغامرة تعليمية تفاعلية'}</div><h1>مغامرة القواسم: رحلة البحث عن الكنز</h1><p>اكتشفي القاسم المشترك الأكبر عبر ست مراحل قصيرة. اختاري المرحلة للبدء أو تابعي من حيث وصلتِ.</p></section><div class="stagegrid compact-grid">${stages.map((s,i)=>`<button class="stagecard ${state.done.includes(i+1)?'done':''}" onclick="navCard(${i+1})"><span class="cardtop"><span class="number">${i+1}</span><span>${state.done.includes(i+1)?'✓':'←'}</span></span><h3>${s[0]}</h3><span class="cardfoot"><span>${state.done.includes(i+1)?'مكتملة':'ابدئي المرحلة'}</span></span></button>`).join('')}</div><div class="frame-bottom"><span>🏅 ${state.badges.length} شارات · ${state.done.length} من ٦ مراحل</span><span>${state.done.length===6?'💎 اكتملت المغامرة وفتح الكنز':'تبدأ مغامرة جديدة عند إعادة فتح الصفحة'}</span></div></section>`}
function footer(){return `<footer class="footer"><span>مغامرة القواسم · رياضيات الصف السادس</span><span>صُممت للتعلّم والمرح ✨</span></footer>`}
function side(i){let link=state.links[i]||'';return `<aside class="sidepanel"><h3>رصيد المغامرة</h3><div class="statusrow"><span>⭐ النقاط</span><b>${state.points}</b></div><div class="statusrow"><span>🧭 المراحل</span><b>${state.done.length} / ٦</b></div><div style="margin:18px 0">${badgeList()}</div><hr class="divider"><h3>رابط اختياري لهذه المرحلة</h3><p>أضيفي رابط لعبة خارجية إن رغبتِ. لن نضيف روابط من عندنا.</p><input aria-label="رابط خارجي" id="link${i}" type="url" placeholder="https://..." value="${esc(link)}"><button class="btn outline small" onclick="saveLink(${i})">حفظ الرابط</button><button class="btn outline small" onclick="openLink(${i})">فتح الرابط ↗</button><div class="settingsbar">💡 يُحفظ تقدمك وروابطك على هذا الجهاز.</div></aside>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(i){return `<div class="viewhead"><div><div class="eyebrow">المرحلة ${i} من ٦ · ${stages[i-1][2]}</div><h1>${stages[i-1][0]}</h1><p>${stages[i-1][1]}</p></div><span class="number">${i}</span></div>`}
function stage1(){return `<h2>شاهدي واكتشفي</h2><p>ابدئي بمشاهدة فيديو التمهيد، ثم فكّري في سؤال المغامرة.</p><div class="video-box" id="videoBox"><div class="videocontent"><div class="play">▶</div><b>مساحة الفيديو</b><div>أضيفي رابط الفيديو في الخانة أدناه لعرضه هنا.</div></div></div><div class="video-actions" id="videoActions"></div><div class="inputrow"><label for="videoLink"><b>رابط الفيديو:</b></label><input class="textinput" type="url" id="videoLink" placeholder="الصقي رابط الفيديو هنا" value="${esc(state.video)}" style="flex:1"><button class="btn outline small" onclick="saveVideo()">حفظ وعرض</button></div><div class="questionbox"><b>سؤال يفتح باب التفكير:</b><div>كيف نستطيع توزيع الأشياء بالتساوي دون أن يتبقى شيء؟</div></div><h3>فكّري ثم اختاري الفكرة الأقرب:</h3><div id="warmChoices" class="choicegrid">${['نبحث عن عدد يقسم الكميتين دون باقٍ','نجمع الكميتين معًا','نختار العدد الأكبر'].map((x,i)=>`<button class="choice" onclick="warm(${i},this)">${x}</button>`).join('')}</div><div class="feedback" id="warmFeedback"></div><button class="btn primary" onclick="completeWarm()">أنهيت التمهيد ✓</button>`}
function stage2(){let nums=[1,2,3,4,6,8,12,16,24];return `<h2>لعبة: اختاري القواسم المشتركة</h2><p>لدينا العددان <b>١٦</b> و<b>٢٤</b>. انقري الأعداد التي تقسم العددين دون باقٍ، ثم تحققي من اختيارك.</p><div class="gamearea"><div><b>قواسم ١٦:</b> ١، ٢، ٤، ٨، ١٦</div><div><b>قواسم ٢٤:</b> ١، ٢، ٣، ٤، ٦، ٨، ١٢، ٢٤</div><div class="choicegrid" id="factorChoices">${nums.map(n=>`<button class="choice" data-n="${n}" onclick="toggleFactor(${n},this)">${n}</button>`).join('')}</div><button class="btn primary" onclick="checkFactors()">تحققي من اختياراتي</button><div class="feedback" id="factorFeedback"></div><div id="factorReveal"></div></div>`}
const groupQs=[{q:'ما القاسم المشترك الأكبر للعددين ١٦ و٢٤؟',opts:['٤','٦','٨'],a:2,ex:'قواسمهما المشتركة: ١، ٢، ٤، ٨؛ وأكبرها ٨.'},{q:'حلّلي ١٨ و٣٠ إلى عوامل أولية، ثم اختاري ق.م.أ.',opts:['٣','٦','٩'],a:1,ex:'١٨ = ٢ × ٣ × ٣، و٣٠ = ٢ × ٣ × ٥؛ العاملان المشتركان ٢ و٣، وحاصل ضربهما ٦.'},{q:'ما ق.م.أ للأعداد ١٨، ١٢، ٣؟',opts:['٢','٣','٦'],a:1,ex:'القاسم المشترك الأكبر للأعداد الثلاثة هو ٣.'}];
function stage3(){let q=groupQs[groupIndex];return `<h2>تحدي المجموعات</h2><p>تخيّلي فريقك يعمل معًا: نقطة للإجابة الصحيحة ونقطة إضافية لتفسير طريقة الحل.</p><div class="gamearea"><span class="pill">المهمة ${groupIndex+1} من ٣</span><h3>${q.q}</h3><div class="choicegrid">${q.opts.map((x,i)=>`<button class="choice" onclick="groupAnswer(${i},this)">${x}</button>`).join('')}</div><div class="feedback" id="groupFeedback"></div><div id="groupExplain" class="muted"></div><button class="btn outline small" id="groupExplainBtn" style="display:none" onclick="claimGroupExplain()">شرحتُ طريقة الحل +١ نقطة</button><button class="btn primary" id="groupNext" style="display:none" onclick="nextGroup()">${groupIndex===2?'إنهاء التحدي':'المهمة التالية ←'}</button></div><div class="questionbox">🤝 تذكّري: اشرحي للفريق كيف عرفتِ الإجابة.</div>`}
const quizQs=[{q:'ما ق.م.أ للعددين ١٦ و٢٤؟',opts:['٤','٨','١٢'],a:1},{q:'ما ق.م.أ للعددين ١٨ و٣٠؟',opts:['٣','٦','٩'],a:1},{q:'ما ق.م.أ للأعداد ٤٠ و٢٤ و٣٢؟',opts:['٤','٨','١٢'],a:1},{q:'لترتيب الفطائر في صفوف متساوية من ٤٠ سبانخ و٢٤ لحم و٣٢ جبن، ما أكبر عدد من الصفوف؟',opts:['٤','٨','١٢'],a:1}];
function stage4(){let q=quizQs[quizIndex];return `<h2>المسابقة التفاعلية</h2><p>أجيبي عن أسئلة الدرس. اختاري الإجابة الصحيحة لتحصلي على نقاط المسابقة.</p><div class="gamearea"><div class="progresswrap"><div class="progressbar" style="width:${quizIndex/4*100}%"></div></div><p>السؤال ${quizIndex+1} من ٤</p><h3>${q.q}</h3><div class="choicegrid">${q.opts.map((x,i)=>`<button class="choice" onclick="quizAnswer(${i},this)">${x}</button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><button class="btn primary" id="quizNext" style="display:none" onclick="nextQuiz()">${quizIndex===3?'إنهاء المسابقة':'السؤال التالي ←'}</button></div>`}
function stage5(){return `<h2>مهمّة الكنز: الفطائر المتساوية</h2><p>أُعدّت <b>٤٠ فطيرة سبانخ</b> و<b>٢٤ فطيرة لحم</b> و<b>٣٢ فطيرة جبن</b>. نريد ترتيب كل نوع في صفوف متساوية، دون أن يتبقى شيء.</p><div class="gamearea"><div class="results"><div class="result"><b>٤٠</b><span>فطيرة سبانخ</span></div><div class="result"><b>٢٤</b><span>فطيرة لحم</span></div><div class="result"><b>٣٢</b><span>فطيرة جبن</span></div></div><h3>ما أكبر عدد من الصفوف المتساوية؟</h3><div class="inputrow"><input class="textinput" id="cakeRows" type="number" min="1" aria-label="عدد الصفوف" placeholder="عدد الصفوف"><button class="btn primary" onclick="checkCake()">افتحي الكنز 🔑</button></div><div id="cakeFeedback" class="feedback"></div><div id="cakeSolution"></div></div>`}
const exitQs=[{q:'ما القاسم المشترك الأكبر لـ١٦ و٢٤؟',opts:['٦','٨'],a:1},{q:'ما ق.م.أ لـ١٨ و٣٠؟',opts:['٦','٩'],a:0},{q:'ق.م.أ لـ٤٠ و٢٤ و٣٢ هو…',opts:['٤','٨'],a:1}];
function stage6(){let q=exitQs[exitIndex];return `<h2>بطاقة الخروج</h2><p>أجيبي بشكل فردي عن الأسئلة الثلاثة لتتأكدي من فهمك.</p><div class="gamearea"><span class="pill">السؤال ${exitIndex+1} من ٣</span><h3>${q.q}</h3><div class="choicegrid">${q.opts.map((x,i)=>`<button class="choice" onclick="exitAnswer(${i},this)">${x}</button>`).join('')}</div><div class="feedback" id="exitFeedback"></div><button class="btn primary" id="exitNext" style="display:none" onclick="nextExit()">${exitIndex===2?'إنهاء بطاقة الخروج':'السؤال التالي ←'}</button></div>`}
function render(){save();const app=document.getElementById('app');if(view==='home'){app.innerHTML=home();return}let i=Number(view.slice(5)),content=[stage1,stage2,stage3,stage4,stage5,stage6][i-1]();app.innerHTML=`<section class="lesson-frame stage-frame"><header class="frame-top"><button class="btn outline small" onclick="view='home';render()">← الخريطة</button><b>المرحلة ${i} من ٦ · ${stages[i-1][2]}</b><span class="score-chip">⭐ ${state.points} نقطة</span></header><div class="progresswrap"><div class="progressbar" style="width:${Math.round(Math.max(state.done.length,i-1)/6*100)}%"></div></div><section class="stage-heading"><h1>${stages[i-1][0]}</h1><p>${stages[i-1][1]}</p><small class="teacher-label">إعداد المعلمة: هند كعبي</small></section><section class="activity-content">${content}</section><details class="optional-links"><summary>رابط خارجي اختياري لهذه المرحلة</summary><p>أضيفي رابط لعبة خارجية إذا رغبتِ.</p><input aria-label="رابط خارجي" id="link${i}" type="url" placeholder="https://..." value="${esc(state.links[i]||'')}"><button class="btn outline small" onclick="saveLink(${i})">حفظ الرابط</button><button class="btn outline small" onclick="openLink(${i})">فتح الرابط ↗</button></details><footer class="frame-bottom"><button class="btn outline small" onclick="${i===1?`view='home';render()`:`navCard(${i-1})`}">→ المرحلة السابقة</button><span>${state.done.includes(i)?'✓ مرحلة مكتملة':'اختاري إجابتك ثم تحققي منها'}</span><button class="btn outline small" onclick="${i<6?`navCard(${i+1})`:`view='home';render()`}">${i<6?'المرحلة التالية ←':'العودة للرئيسية'}</button></footer></section>`;if(i===1&&state.video)showVideo(state.video)}function addBadge(s){if(!state.badges.includes(s))state.badges.push(s)}
function warm(i,el){document.querySelectorAll('#warmChoices .choice').forEach(b=>b.classList.remove('selected','correct','wrong'));el.classList.add(i===0?'correct':'wrong');let f=document.getElementById('warmFeedback');f.className='feedback '+(i===0?'ok':'no');f.textContent=i===0?'أحسنتِ! نبحث عن عدد يقسم الكميتين دون باقٍ.':'فكّري في القسمة المتساوية دون باقٍ.';window.warmOK=i===0}
function completeWarm(){if(!window.warmOK){toast('اختاري الفكرة الصحيحة أولًا.');return}addBadge('مستكشفة');markDone(1);toast('أحسنتِ! حصلتِ على شارة المستكشفة.');render()}
function safeURL(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null}catch{return null}}
function saveVideo(){let u=document.getElementById('videoLink').value.trim();if(!safeURL(u)){toast('تحققي من الرابط: استخدمي رابطًا كاملًا يبدأ بـ https://');return}state.video=u;save();showVideo(u);toast('حُفظ الرابط. إذا لم يبدأ التشغيل، استخدمي زر فتح الفيديو أسفل المعاينة.')}
function showVideo(u){let url=safeURL(u);if(!url){toast('أضيفي رابط فيديو كاملًا يبدأ بـ https://');return}let parsed=new URL(url),host=parsed.hostname.toLowerCase(),embed='';if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com','youtu.be'].includes(host)){let id=parsed.searchParams.get('v')||parsed.pathname.match(/\/(?:shorts|embed|live)\/([\w-]+)/)?.[1]||(host==='youtu.be'?parsed.pathname.split('/').filter(Boolean)[0]:null);if(id&&/^[\w-]{6,}$/.test(id))embed=`https://www.youtube-nocookie.com/embed/${id}?controls=1&playsinline=1`}else if(['vimeo.com','www.vimeo.com','player.vimeo.com'].includes(host)){let id=parsed.pathname.match(/(?:video\/)?(\d{6,})/)?.[1];if(id)embed=`https://player.vimeo.com/video/${id}?controls=1`}else if(host==='drive.google.com'||host==='docs.google.com'){let id=parsed.pathname.match(/\/file\/d\/([\w-]+)/)?.[1]||parsed.searchParams.get('id');if(id)embed=`https://drive.google.com/file/d/${id}/preview`}let box=document.getElementById('videoBox'),actions=document.getElementById('videoActions');if(actions)actions.innerHTML=`<a class="btn outline small" target="_blank" rel="noopener noreferrer" href="${esc(url)}">فتح الفيديو في صفحة جديدة ↗</a>`;if(embed){box.innerHTML=`<iframe title="فيديو التمهيد" src="${embed}" style="width:100%;height:100%;border:0" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`;return}if(/\.(mp4|webm|ogv|ogg|m4v|m3u8)$/i.test(parsed.pathname)){box.innerHTML=`<video src="${esc(url)}" controls playsinline style="width:100%;height:100%;object-fit:contain"><a href="${esc(url)}" target="_blank" rel="noopener">افتحي الفيديو في صفحة جديدة</a></video>`;return}box.innerHTML=`<div class="videocontent"><div class="play">↗</div><b>الرابط جاهز للمشاهدة</b><div>بعض المنصات لا تسمح بتشغيل الفيديو داخل الموقع.</div></div>`}
function saveLink(i){state.links[i]=document.getElementById('link'+i).value.trim();save();toast('حُفظ الرابط لهذه المرحلة.')}function openLink(i){let u=safeURL(document.getElementById('link'+i).value.trim());if(!u){toast('لم يُضف رابط لهذه المرحلة بعد.');return}state.links[i]=u;save();window.open(u,'_blank','noopener,noreferrer')}
function toggleFactor(n,b){if(selectedFactors.includes(n)){selectedFactors=selectedFactors.filter(x=>x!==n);b.classList.remove('selected')}else{selectedFactors.push(n);b.classList.add('selected')}}
function checkFactors(){let expected=[1,2,4,8].sort((a,b)=>a-b),got=[...selectedFactors].sort((a,b)=>a-b),ok=expected.join()==got.join();let f=document.getElementById('factorFeedback');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'إجابة صحيحة! هذه هي القواسم المشتركة كلها.':'ليست كل الاختيارات صحيحة بعد. قارني القواسم وحاولي مرة أخرى.';if(ok){document.getElementById('factorChoices').querySelectorAll('.choice').forEach(b=>{if(expected.includes(+b.dataset.n))b.classList.add('correct')});document.getElementById('factorReveal').innerHTML='<div class="questionbox"><b>القواسم المشتركة:</b> ١، ٢، ٤، ٨. <b>إذن ق.م.أ = ٨.</b></div><button class="btn primary" onclick="completeFactors()">أكملت اكتشاف القاعدة ✓</button>'}}
function completeFactors(){addBadge('كاشفة القواسم');markDone(2);toast('رائعة! ق.م.أ للعددين ١٦ و٢٤ هو ٨.');render()}
function groupAnswer(n,b){let q=groupQs[groupIndex],ok=n===q.a;document.querySelectorAll('.gamearea .choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');let f=document.getElementById('groupFeedback');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'إجابة صحيحة! +١ نقطة':'الإجابة الصحيحة: '+q.opts[q.a];document.getElementById('groupExplain').textContent=q.ex+' اشرحي ذلك لفريقك لتحصلي على نقطة التفسير الإضافية.';document.getElementById('groupExplainBtn').style.display='inline-flex';document.getElementById('groupNext').style.display='inline-flex';groupExplainAwarded=false;if(ok)state.points+=1;save()}
function claimGroupExplain(){if(groupExplainAwarded)return;groupExplainAwarded=true;state.points+=1;save();document.getElementById('groupExplainBtn').style.display='none';toast('نقطة إضافية رائعة على شرحك!')}
function nextGroup(){groupIndex++;if(groupIndex>=3){groupIndex=0;addBadge('قائدة الفريق');markDone(3);toast('اكتمل تحدي المجموعات!');render()}else render()}
function quizAnswer(n,b){let q=quizQs[quizIndex],ok=n===q.a;document.querySelectorAll('.gamearea .choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');let f=document.getElementById('quizFeedback');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'صحيح! أضيفت ٥ نقاط.':'الإجابة الصحيحة: '+q.opts[q.a];if(ok)state.points+=5;save();document.getElementById('quizNext').style.display='inline-flex'}
function nextQuiz(){quizIndex++;if(quizIndex>=4){quizIndex=0;addBadge('نجمة المسابقة');markDone(4);toast('أنهيتِ المسابقة!');render()}else render()}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function checkCake(){let n=Number(document.getElementById('cakeRows').value),f=document.getElementById('cakeFeedback');if(n!==8){f.className='feedback no';f.textContent='حاولي ثانية: ابحثي عن ق.م.أ للأعداد ٤٠ و٢٤ و٣٢.';return}cakeDone=true;f.className='feedback ok';f.textContent='صحيح! ق.م.أ للأعداد ٤٠ و٢٤ و٣٢ هو ٨ صفوف.';document.getElementById('cakeSolution').innerHTML='<div class="questionbox">في كل صف: ٥ فطائر سبانخ، و٣ لحم، و٤ جبن. <b>المجموع = ٤٠ + ٢٤ + ٣٢ = ٩٦ فطيرة.</b></div><div style="font-size:62px;text-align:center">🔓💎</div><button class="btn primary" onclick="completeCake()">أتممت مهمة الكنز ✓</button>'}
function completeCake(){if(!cakeDone)return;addBadge('صاحبة الكنز');markDone(5);toast('فُتح صندوق الكنز!');render()}
function exitAnswer(n,b){let q=exitQs[exitIndex],ok=n===q.a;document.querySelectorAll('.gamearea .choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');let f=document.getElementById('exitFeedback');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'إجابة صحيحة!':'راجعي القاعدة: '+q.opts[q.a];if(ok)state.points+=5;save();document.getElementById('exitNext').style.display='inline-flex'}function nextExit(){exitIndex++;if(exitIndex>=3){exitIndex=0;addBadge('متقنة القاسم الأكبر');markDone(6);toast('اكتملت بطاقة الخروج. أحسنتِ!');render()}else render()}
render();
</script></body></html>
